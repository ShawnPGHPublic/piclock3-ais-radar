# The shape of config.yaml.  Required: without it the clock will not load
# the plugin.  Defaults live in config.yaml, not here.

description: >
  A shoreline radar.  A half-circle of AIS traffic looking out to sea from
  a latitude and longitude you set, fed by AISHub or AISStream.  The flat
  edge is the beach.  The caption under it is the radius and the time the
  feed last answered.  How big it is on the page is the layout region, the
  same as every other widget.

settings:

  latitude:
    of: [number, string]
    help: Latitude of the shore point the half-circle is centered on.  A
      number, or a brace name such as {location.latitude}.
  longitude:
    of: [number, string]
    help: Longitude of the shore point.  A number, or a brace name such as
      {location.longitude}.
  bearing:
    is: number
    range: [0, 360]
    unit: degrees
    help: Which way the water is, in degrees true.  0 is north.  The flat
      edge is the shoreline and the arc opens this way.
  radius:
    is: number
    range: [0.1, 500]
    help: How far the arc reaches, in radius-unit.
  radius-unit:
    is: string
    help: mi or km.  The caption prints the radius in this unit.
  source:
    is: string
    help: aishub or aisstream.  AISHub is polled.  AISStream stays connected
      while this page is on screen.
  username:
    is: string
    help: AISHub username.  Write {apikeys.aishub} and put the username in
      ApiKeys.yaml, not in this file.
  apikey:
    is: string
    help: AISStream API key.  Write {apikeys.aisstream} and put the key in
      ApiKeys.yaml.  Used only when source is aisstream.
  refresh:
    is: number
    unit: seconds
    range: [5, 86400]
    help: How often AISHub is polled, and how often a dropped AISStream
      socket is tried again.  AISHub is never asked more than once a minute.
  max-age:
    is: number
    unit: minutes
    range: [1, 180]
    help: How long a target stays on the scope after its last report.
  max-targets:
    is: number
    range: [1, 2000]
    help: How many of the nearest targets are drawn when the box is crowded.
  sweep:
    is: number
    unit: seconds
    range: [2, 60]
    help: How long the beam takes to cross the half-circle.
  legend:
    is: bool
    help: Show the ship-type key above the arc.  false leaves only the
      scope and the caption.
  font-size:
    is: font-size
    help: How tall the caption is, as a fraction of the region's height or
      as a measure such as 16px.  The widget's display size is the region
      the layout gives it.
